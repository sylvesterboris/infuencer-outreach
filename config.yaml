# ---------------------------------------------------------------------------
# Micro-Influencer Outreach Pipeline - configuration
# Secrets (API keys, SMTP password) live in .env, never in this file.
# ---------------------------------------------------------------------------

paths:
  output_dir: outputs            # relative to this file
  database: outputs/pipeline.db

brand:
  name: EDXSO
  website: https://edxso.com
  one_liner: an EdTech startup building AI-driven learning tools for K-12 schools in India
  offer: early access to our AI learning tools, plus a paid or affiliate partnership depending on the format
  sender_name: Aman
  sender_title: Creator Partnerships
  # Appended to every email under the AI-written body (not counted in the 60-90 words)
  opt_out_line: "Not interested? Just reply 'no thanks' and we won't email you again."

discovery:
  platform: youtube
  # 'video' search surfaces channels that posted recently (better for finding active
  # micro creators); 'channel' search returns channels directly but skews to big ones.
  search_type: video
  published_within_days: 90
  region_code: IN              # biases results, does not filter
  relevance_language: en
  results_per_page: 50
  pages_per_query: 1
  target_candidates: 150       # stop searching once this many unique channels are found
  queries:
    - tech review
    - gadget review india
    - smartphone review hindi
    - laptop review
    - coding tutorial for beginners
    - programming tutorial
    - AI tools tutorial
    - ChatGPT tutorial
    - web development tutorial
    - python tutorial
    - tech tips and tricks
    - pc build guide
    - cybersecurity explained
    - data science tutorial
    - edtech tools for teachers

collection:
  recent_videos_to_fetch: 12
  videos_for_engagement: 10
  min_video_age_days: 3        # very new videos haven't settled yet; skip them for ER

youtube:
  daily_quota_budget: 8000     # stay under the default 10,000 units/day
  cache_ttl_hours: 24
  request_timeout_seconds: 20

filtering:
  category: Technology
  platform: YouTube
  min_subscribers: 5000
  max_subscribers: 100000
  min_engagement_rate: 0.01    # (likes + comments) / views over recent videos = 1%
  min_videos_analysed: 3
  max_days_since_upload: 60
  min_relevance_score: 0.35
  allowed_countries: []        # e.g. ["IN"] to require Indian channels; empty = any
  exclude_made_for_kids: true
  brand_safety_blocklist:
    - betting
    - casino
    - gambling
    - satta
    - 18+
    - adult
    - mod apk
    - cracked
    - free fire hack
    - earn money fast

enrichment:
  website_email_lookup: true   # visit the creator's own linked site/contact page (robots.txt respected)
  website_max_pages: 3
  website_timeout_seconds: 8
  use_llm_content_analysis: true

llm:
  provider: groq
  model: qwen/qwen3.8-27b
  temperature: 0.7
  max_attempts: 3              # regenerate when a message fails validation
  min_seconds_between_calls: 2.5

messages:
  email_words: [60, 90]
  dm_words: [15, 30]
  banned_phrases:
    - hope this email finds you well
    - hope this finds you well
    - game-changer
    - game changer
    - synergy
    - delve
    - leverage
    - revolutionize
    - unlock the power
    - in today's fast-paced

sending:
  mode: dry-run                # dry-run | smtp
  require_approval: true       # messages must be approved before they are sent
  # When set, live SMTP sends go to this address instead of the influencer
  # (safe end-to-end testing). Leave empty only for real outreach.
  test_recipient_override: ""
  delay_seconds: 3
  daily_cap: 40
